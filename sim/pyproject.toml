[project]
name = "robot-isaaclab30-experiment"
version = "0.1.0"
description = "Robot用Isaac Lab 3とIsaac Sim 6.2の分離検証環境"
requires-python = ">=3.12,<3.13"
dependencies = [
  "isaaclab[isaacsim]==3.0.0",
  "tinyobjloader==2.0.0rc13",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Isaac Lab v3.0.0公式uv-overrides.txtの範囲内で互換版を固定。
# Isaac Sim wheelの厳密な依存pinと衝突するため、pip checkでは差異が残る。
override-dependencies = [
  "numpy==2.3.1",
  "mujoco~=3.12.0",
  "mujoco-warp~=3.12.0",
  "newton[sim]==1.6.1",
  "newton-usd-schemas==0.5.0",
  "usd-exchange==3.0.1",
  "usd-optimize~=1.3.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "fsspec==2026.6.0",
  "packaging==26.0",
  "urllib3==2.8.0",
]

# NVIDIA indexのmetadataと、実際の6.2.0.0 Linux wheelの依存が異なる。
[[tool.uv.dependency-metadata]]
name = "isaacsim-robot"
version = "6.2.0.0"
requires-python = "==3.12.*"
requires-dist = [
  "isaacsim-sensor==6.2.0.0",
  "isaacsim-robot-motion==6.2.0.0",
  "py_trees==2.4.0",
  "pydot==4.0.1",
  "pyparsing==3.3.2",
  "six==1.17.0",
  "transitions==0.9.3",
  "onnxruntime-gpu==1.26.0",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
